spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: vocabverse
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:200MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:220MB}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET:local-development-jwt-secret-key-change-before-production-123456}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}

ai:
  groq:
    api-key: ${GROQ_API_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  normalize:
    trial:
      daily-limit: ${AI_NORMALIZE_TRIAL_DAILY_LIMIT:3}

dictionary:
  api:
    base-url: ${DICTIONARY_API_BASE_URL:}

storage:
  endpoint: ${STORAGE_ENDPOINT:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    upload-folder: ${CLOUDINARY_UPLOAD_FOLDER:vocabverse/shadowing}

shadowing:
  ai:
    subtitle:
      enabled: ${SHADOWING_AI_SUBTITLE_ENABLED:true}
      transcription-model: ${SHADOWING_AI_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
      translation-model: ${SHADOWING_AI_TRANSLATION_MODEL:llama-3.1-8b-instant}

notification:
  review-link: ${NOTIFICATION_REVIEW_LINK:/reviews/today}
  email:
    listener:
      enabled: ${NOTIFICATION_EMAIL_LISTENER_ENABLED:true}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
youtube:
  download:
    yt-dlp-path: python -m yt_dlp

audio:
  extractor:
    ffmpeg-path: C:\\Users\\DELL\\AppData\\Local\\ffmpegio\\ffmpeg-downloader\\ffmpeg\\bin\\ffmpeg.exe
